# bgraph selection: example GitHub Actions workflow that runs only the affected tests.
#
# The qxbao/bgraph action installs a release binary, computes the selection for the change and outputs the runner
# commands. When bgraph cannot bound the change (scope `full`: a config or lockfile edit, an unresolved import, no base
# commit...), `full` is 'true' and the full suite runs instead. Run the shadow workflow (shadow-github-actions.yml)
# first and switch to selection once it has been clean for a while.
#
# Outputs: scope (none | graph | package | module | full), full ('true' | 'false'), commands (one shell line each),
# script (a bash script with the commands), json (the plan as JSON).

name: affected tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required: bgraph diffs against the base commit; a shallow clone makes every run "full"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Base: the PR target on pull_request; on push, the commit before the push (HEAD~1 for a new branch).
      # Pin a release (e.g. version: v0.1.0) for reproducible runs; `with: base:` overrides the base.
      - name: Select affected tests
        id: bgraph
        uses: qxbao/bgraph@v0

      - name: Run affected tests
        if: steps.bgraph.outputs.full != 'true'
        env:
          SCRIPT: ${{ steps.bgraph.outputs.script }}
        run: bash "$SCRIPT" # empty for scope `none`: nothing to run

      - name: Run the full suite
        if: steps.bgraph.outputs.full == 'true'
        run: npm test
