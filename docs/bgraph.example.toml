# bgraph.toml: optional declarations for what bgraph cannot infer from the code.
#
# Put this file at the repository root and commit it. Without one, bgraph reads imports and runner configs on its own
# and widens the selection (to the project or to the full suite) whenever it is not sure. This file is the place to say
# what it could not find out.
#
# Every entry falls into one of two kinds, and the difference matters:
#
#   WIDENING   (safe):   adds dependencies, so more tests run. A wrong entry only costs time.
#   NARROWING  (trust):  tells bgraph that something it would widen on is fine, so fewer tests run. A wrong entry
#                        can make bgraph SKIP A TEST THAT THE CHANGE BREAKS. These entries require a `reason`;
#                        review them like code and re-check them when the config they describe changes.
#
# Changing this file is itself a change: the run that changes it selects the full suite (user_rule).
# A file that does not parse also selects the full suite, and the error says where. Unknown keys are errors.
#
# Paths are repo-relative with forward slashes. Globs: `*` (one segment), `**` (any depth), `?`, `[abc]`, `{a,b}`.
#
# Start from what bgraph tells you: `bgraph unresolved` lists every import or config key it could not read, and
# prints a ready-to-edit snippet for this file next to each one.

# ---------------------------------------------------------------------------------------------------------------------
# [[rule]]: a dependency that no import expresses.
#
#   paths   : globs of files whose change the rule is about (required).
#   affects : what such a change affects (required), one of:
#               "all"          -> run the full suite                                    (WIDENING)
#               [dirs/globs]   -> also run every test under these project directories,
#                                 or the tests matching these globs                     (WIDENING)
#               "none"         -> the change affects no test                            (NARROWING)
#                                 Only accepted for files nothing imports: if a file in `paths` is part of the
#                                 import graph, the rule is ignored and reported as rule_rejected.
#   reason  : free text, shown in explanations. Strongly recommended; nothing checks it.
# ---------------------------------------------------------------------------------------------------------------------

[[rule]]
# Code is generated from the .proto files at build time; nothing imports the .proto files themselves.
paths = ["proto/**/*.proto"]
affects = ["services/api", "web/src/gen/**/*.test.ts"]
reason = "services/api and the web client are generated from the protos"

[[rule]]
# A test reads these fixtures with fs.readFileSync(path.join(__dirname, name)), a path bgraph cannot follow.
paths = ["tests/fixtures/**"]
affects = ["tests/format/**/*.test.js"]
reason = "format tests load every fixture by directory listing"

[[rule]]
# Editor and repo-maintenance files that no test can observe.
paths = [".vscode/**", "CODEOWNERS"]
affects = "none"
reason = "not read by any build or test"

# ---------------------------------------------------------------------------------------------------------------------
# [[generated]]: build outputs that are ignored by git but imported by code (e.g. tests import "../dist/index.js").
#
# Without an entry, bgraph treats such an import as depending on every file of the package that builds it. An entry
# names the files the output is really built from, so only changes to those select the importing tests.
# (NARROWING: if the build also reads files outside `sources`, such as its own config, list them too.)
#
#   outputs : globs of the generated files (required).
#   sources : globs of the files they are built from. Empty -> keep the default (any file of the package).
#   owner   : the project directory that builds them (required).
# ---------------------------------------------------------------------------------------------------------------------

[[generated]]
outputs = ["packages/ui/dist/**"]
sources = ["packages/ui/src/**"]
owner = "packages/ui"

# ---------------------------------------------------------------------------------------------------------------------
# [[config]]: describe runner-config keys that are computed in code.                                  (NARROWING)
#
# bgraph reads vitest/vite/jest/playwright configs as literals. When a key that controls module resolution or the
# test set is built by code (a function call, a variable, a spread, a helper module), it cannot know the value and
# reports config_is_code: every test of the project is then selected for any change in the project. A [[config]]
# entry tells bgraph what that code computes, so it can stop widening for those keys of that one file.
#
# bgraph keeps every other check. The config file is still a dependency of all its tests; any key you do not list
# still widens; and if `file` does not exist, the entry does nothing and the widening stays.
#
#   file         : the runner config, e.g. "vitest.config.ts" (required).
#   replaces     : the computed keys this entry describes (required). Supported:
#                    "alias", "moduleNameMapper"           module aliases
#                    "include", "testMatch", "testRegex"   which files are tests
#                    "projects", "workspace"               sub-projects
#   reason       : why the description is right (required).
#
#   For "alias" / "moduleNameMapper":
#   alias        : { "<spec>" = "<path>" } with vite semantics: an import equal to <spec>, or starting with "<spec>/",
#                  resolves to <path> (plus the rest of the import). <path> is a file or directory in the repo.
#   alias_regex  : { "<regex>" = "<path>" } with jest moduleNameMapper semantics: the regex must match the whole
#                  import; $1..$9 in <path> are replaced by the groups. Use single quotes for regexes in TOML
#                  ('^@app/(.*)$') so backslashes are kept as written.
#                  Both may be omitted when the computed alias only points imports at what normal package
#                  resolution already finds (the workspace package's own package.json "exports"/"main").
#
#   For "include" / "testMatch" / "testRegex":
#   tests        : globs of the test files. Omitted -> bgraph's default detection (*.test.*, *.spec.*, files under
#                  __tests__/, test.js and similar names) must find every test; if some tests are named otherwise,
#                  list them here.
#
#   For "projects" / "workspace": no extra field. The entry states that the sub-projects only split the same tests
#                  (sharding, per-environment runs) and add no alias or test files beyond what this entry describes.
#
#   Optional, any key:
#   sources      : helper files the config imports to compute these keys (e.g. "scripts/aliases.js"). Their
#                  computed lookups (readdirSync, new URL(`../packages/${dir}`), dynamic import) are what this entry
#                  describes, so they no longer make every test depend on every file they could list. Their static
#                  imports stay, and editing a source still selects every test of the config.
#   ignore_paths : path literals written in the config that belong to the computation, not inputs of every test
#                  (e.g. the "packages/svelte" in path.resolve('packages/svelte', ...) inside a custom resolver).
#                  By default bgraph treats any repo path named in a config as a dependency of all its tests.
# ---------------------------------------------------------------------------------------------------------------------

[[config]]
# vue-style: resolve.alias = entries, built in scripts/aliases.js from a listing of packages/.
file = "vitest.config.ts"
replaces = ["alias"]
alias = { "vue" = "packages/vue/src/index.ts" }
alias_regex = { '^@vue/([a-z-]+)$' = "packages/$1/src/index.ts" }
sources = ["scripts/aliases.js"]
reason = "scripts/aliases.js maps vue to packages/vue/src and @vue/<dir> to packages/<dir>/src/index.ts"

[[config]]
# svelte-style: a customResolver that resolves svelte/* through packages/svelte/package.json "exports", and
# projects/include generated from a shard table.
file = "vitest.config.js"
replaces = ["alias", "include", "projects"]
tests = ["packages/svelte/**/*.test.ts", "packages/svelte/tests/*/test.ts"]
ignore_paths = ["packages/svelte"]
reason = "svelte_alias() follows the package exports; the projects only shard the same test files"

# ---------------------------------------------------------------------------------------------------------------------
# [options]
#   max_changed : above this many changed files, run the full suite (diff_too_large). Default 5000.
# ---------------------------------------------------------------------------------------------------------------------

[options]
max_changed = 5000
